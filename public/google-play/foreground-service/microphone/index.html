<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <link
      rel="canonical"
      href="https://shuuty.com/google-play/foreground-service/microphone/"
    />
    <title>Shuuty microphone foreground service demonstration</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0d1117;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 560px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 5vw, 2rem);
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
      }

      video {
        display: block;
        width: min(100%, 480px);
        max-height: 75vh;
        margin: 24px auto;
        background: #000;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Microphone foreground service demonstration</h1>
      <p>
        This privacy-reviewed recording demonstrates how Shuuty keeps a
        voice-task recording active while the app is in the background and
        displays the required persistent Android notification.
      </p>
      <video controls playsinline preload="metadata">
        <source src="./voice-task-fgs-demo-redacted-v6.mp4" type="video/mp4" />
        Your browser does not support HTML video.
      </video>
    </main>
  </body>
</html>
